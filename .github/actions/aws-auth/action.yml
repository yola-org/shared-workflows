name: Configure AWS credentials
description: >-
  Authenticates to AWS with static access keys.

inputs:
  aws-region:
    description: AWS region.
    required: false
    default: 'ca-central-1'
  access-key-id:
    description: AWS access key ID.
    required: true
  secret-access-key:
    description: AWS secret access key.
    required: true

runs:
  using: composite
  steps:
    - name: Validate credentials
      shell: bash
      env:
        ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
      run: |
        set -euo pipefail

        if [ -z "$ACCESS_KEY_ID" ] || [ -z "$SECRET_ACCESS_KEY" ]; then
          echo "::error::AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must be configured."
          exit 1
        fi

    - name: Configure credentials
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        aws-access-key-id: ${{ inputs.access-key-id }}
        aws-secret-access-key: ${{ inputs.secret-access-key }}
        aws-region: ${{ inputs.aws-region }}
