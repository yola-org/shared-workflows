name: Calculate semantic version
description: >-
  Computes the next semantic version from Git tags and the commit title.
  Port of templates/version.yml. Requires a full checkout
  (actions/checkout with fetch-depth: 0 and fetch-tags: true).

inputs:
  prefix:
    description: 'Version stream prefix, e.g. "dev-" or "prod-". Empty for the default stream.'
    required: false
    default: ''
  initial:
    description: Version used when no tag exists for the stream.
    required: false
    default: '1.0.0'
  bump:
    description: 'major | minor | patch. Empty = detect from the commit title.'
    required: false
    default: ''
  commit-message:
    description: Commit message used for bump detection. Defaults to the checked-out commit subject.
    required: false
    default: ''

outputs:
  version:
    description: Version without prefix, e.g. 1.2.0.
    value: ${{ steps.calculate.outputs.version }}
  git_tag:
    description: Full tag name, e.g. dev-1.2.0.
    value: ${{ steps.calculate.outputs.git_tag }}
  bump:
    description: Bump that was applied (major, minor or patch).
    value: ${{ steps.calculate.outputs.bump }}
  latest_tag:
    description: Latest tag found for the stream, or empty.
    value: ${{ steps.calculate.outputs.latest_tag }}

runs:
  using: composite
  steps:
    - id: calculate
      shell: bash
      env:
        VERSION_PREFIX: ${{ inputs.prefix }}
        VERSION_INITIAL: ${{ inputs.initial }}
        VERSION_BUMP: ${{ inputs.bump }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        set -euo pipefail

        PREFIX="${VERSION_PREFIX:-}"
        INITIAL="${VERSION_INITIAL:-1.0.0}"
        BUMP="${VERSION_BUMP:-}"

        if ! printf '%s\n' "$INITIAL" |
          awk '/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ { valid=1 }
               END { exit !valid }'; then
          echo "::error::Invalid initial version: ${INITIAL}"
          exit 1
        fi

        # Tags may be missing from shallow checkouts even when fetch-depth is 0.
        git fetch --force --tags origin

        LATEST_TAG="$(
          git tag --list "${PREFIX}[0-9]*" --sort=-version:refname |
          awk -v prefix="$PREFIX" '
            {
              version = $0

              if (prefix != "") {
                if (index(version, prefix) != 1)
                  next

                version = substr(version, length(prefix) + 1)
              }

              if (version ~ /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/) {
                print $0
                exit
              }
            }
          '
        )"

        if [ -n "${COMMIT_MESSAGE:-}" ]; then
          TITLE="${COMMIT_MESSAGE%%$'\n'*}"
        else
          TITLE="$(git log -1 --pretty=%s)"
        fi

        if [ -n "$BUMP" ]; then
          TITLE="$(git log -1 --pretty=%s)"
        else
          case "$TITLE" in
            '!feat:'*|'!feat('*'):'*|feat'!:'*|feat'('*')!:'*)
              BUMP="major"
              ;;
            feat:*|feat\(*\):*)
              BUMP="minor"
              ;;
            *)
              BUMP="patch"
              ;;
          esac
        fi

        case "$BUMP" in
          major|minor|patch)
            ;;
          *)
            echo "::error::Invalid version bump: ${BUMP}"
            exit 1
            ;;
        esac

        if [ -z "$LATEST_TAG" ]; then
          VERSION="$INITIAL"
        else
          CURRENT="${LATEST_TAG#"$PREFIX"}"
          MAJOR="${CURRENT%%.*}"
          REST="${CURRENT#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
        fi

        GIT_TAG="${PREFIX}${VERSION}"

        if ! git check-ref-format "refs/tags/${GIT_TAG}"; then
          echo "::error::Invalid Git tag: ${GIT_TAG}"
          exit 1
        fi

        if git ls-remote --exit-code --tags origin "refs/tags/${GIT_TAG}" >/dev/null 2>&1; then
          echo "::error::Tag ${GIT_TAG} already exists."
          exit 1
        fi

        {
          echo "version=${VERSION}"
          echo "git_tag=${GIT_TAG}"
          echo "bump=${BUMP}"
          echo "latest_tag=${LATEST_TAG}"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### Semantic version"
          echo ""
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Commit title | \`${TITLE}\` |"
          echo "| Latest tag | \`${LATEST_TAG:-none}\` |"
          echo "| Bump | \`${BUMP}\` |"
          echo "| Next version | \`${VERSION}\` |"
          echo "| Git tag | \`${GIT_TAG}\` |"
        } >> "$GITHUB_STEP_SUMMARY"
