name: Reusable · Terraform plan
# Initialises Terraform against the remote backend, produces a saved plan and uploads it as an artifact for the matching apply workflow.
on:
  workflow_call:
    inputs:
      working-directory:
        description: Terraform root module directory, e.g. envs/dev.
        type: string
        required: true
      artifact-name:
        description: Name of the uploaded plan artifact.
        type: string
        required: true
      aws-region:
        description: AWS region. Defaults to the AWS_REGION repository variable.
        type: string
        required: false
        default: ${{ vars.AWS_REGION || 'ca-central-1' }}
      terraform-version:
        description: Terraform CLI version.
        type: string
        required: false
        default: '1.11.0'
      env-vars:
        description: Newline-separated KEY=VALUE pairs exported to the Terraform process.
        type: string
        required: false
        default: ''
      timeout-minutes:
        description: Job timeout.
        type: number
        required: false
        default: 30
    secrets:
      AWS_ACCESS_KEY_ID:
        description: Static AWS access key ID.
        required: true
      AWS_SECRET_ACCESS_KEY:
        description: Static AWS secret access key.
        required: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      AWS_REGION: ${{ inputs.aws-region }}
      AWS_DEFAULT_REGION: ${{ inputs.aws-region }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: yola-org/shared-workflows/.github/actions/aws-auth@main
        with:
          aws-region: ${{ inputs.aws-region }}
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Export Terraform variables
        if: ${{ inputs.env-vars != '' }}
        shell: bash
        env:
          EXTRA_ENV: ${{ inputs.env-vars }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EXTRA_ENV" >> "$GITHUB_ENV"

      - name: Prepare provider cache
        shell: bash
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/tfplan
          if-no-files-found: error
          retention-days: 7
