name: Reusable · Gradle check

on:
  workflow_call:
    inputs:
      task:
        description: Gradle task to run.
        type: string
        required: true
      java-version:
        description: JDK version.
        type: string
        default: '25'
      java-distribution:
        description: JDK distribution.
        type: string
        default: temurin
      report-path:
        description: Optional path to the reports generated by the task.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: ${{ inputs.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Run Gradle task
        shell: bash
        env:
          GRADLE_TASK: ${{ inputs.task }}
        run: |
          chmod +x gradlew
          ./gradlew -- "$GRADLE_TASK"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && inputs.report-path != '' }}
        with:
          name: ${{ inputs.task }}-report
          path: ${{ inputs.report-path }}

