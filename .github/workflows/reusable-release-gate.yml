name: Reusable · release gate
# Decides whether release jobs should run for a push to the release branch.
on:
  workflow_call:
    inputs:
      base-branch:
        description: Branch that releases are allowed from.
        type: string
        required: false
        default: main
      require-merged-pr:
        description: Only release when the pushed commit belongs to a merged pull request.
        type: boolean
        required: false
        default: false
    outputs:
      release:
        description: '"true" when the release jobs should run.'
        value: ${{ jobs.gate.outputs.release }}

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: Check release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.gate.outputs.release }}
    steps:
      - id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BASE_BRANCH: ${{ inputs.base-branch }}
          REQUIRE_MERGED_PR: ${{ inputs.require-merged-pr }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "push" ] || [ "$REF" != "refs/heads/$BASE_BRANCH" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$REQUIRE_MERGED_PR" != "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if the commit message indicates a merge commit or squash merge
          if printf '%s\n' "${COMMIT_MSG:-}" | grep -Eq '^(Merge |.*\([#][0-9]+\)$)'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Query GitHub API for associated merged pull requests
          PRS="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" 2>/dev/null || echo '[]')"
          COUNT="$(printf '%s' "$PRS" | jq -r --arg branch "$BASE_BRANCH" \
            '[.[] | select(.merged_at != null and .base.ref == $branch)] | length' 2>/dev/null || echo 0)"

          if [ "$COUNT" -gt 0 ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
