name: Reusable · release gate
# Decides whether release jobs should run for a push to the release branch.
# With require-merged-pr enabled, the pushed commit must belong to a merged
# pull request targeting that branch.
on:
  workflow_call:
    inputs:
      base-branch:
        description: Branch that releases are allowed from.
        type: string
        required: false
        default: main
      require-merged-pr:
        description: Only release when the pushed commit belongs to a merged pull request.
        type: boolean
        required: false
        default: true
    outputs:
      release:
        description: '"true" when the release jobs should run.'
        value: ${{ jobs.gate.outputs.release }}

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: Check release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.gate.outputs.release }}
    steps:
      - id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BASE_BRANCH: ${{ inputs.base-branch }}
          REQUIRE_MERGED_PR: ${{ inputs.require-merged-pr }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "push" ] || [ "$REF" != "refs/heads/$BASE_BRANCH" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$REQUIRE_MERGED_PR" != "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PRS="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls")"
          COUNT="$(printf '%s' "$PRS" | jq --arg branch "$BASE_BRANCH" \
            '[.[] | select(.merged_at != null and .base.ref == $branch)] | length')"

          if [ "$COUNT" -gt 0 ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
