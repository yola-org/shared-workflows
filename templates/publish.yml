
# ============================================================
# Reusable GitLab publishing template
#
# Publishes Docker images to GitLab Container Registry.
#
# Required:
#   Dockerfile in project root (configurable)
#   GitLab Container Registry enabled
#
# Optional variables:
#   DOCKERFILE_PATH
#   DOCKER_BUILD_CONTEXT
#   IMAGE_NAME
# ============================================================

variables:
  DOCKERFILE_PATH: "Dockerfile"
  DOCKER_BUILD_CONTEXT: "."
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"

stages:
  - publish

docker:publish:
  stage: publish
  image: docker:cli
  services:
    - name: docker:dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - |
      echo "$CI_REGISTRY_PASSWORD" |
        docker login "$CI_REGISTRY" \
          -u "$CI_REGISTRY_USER" \
          --password-stdin
  script:
    - |
      set -e

      echo "Building ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"

      docker build \
        -f "$DOCKERFILE_PATH" \
        -t "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" \
        -t "${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}" \
        "$DOCKER_BUILD_CONTEXT"

      docker push "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
      docker push "${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}"

      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" \
          "${IMAGE_NAME}:latest"
        docker push "${IMAGE_NAME}:latest"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH'
