# Gradle test + build (JDK 25). Override GRADLE_IMAGE per project if needed.
#
# Include BOTH files in the consuming repo:
#
#   include:
#     - project: my-group/ci-templates
#       ref: v1.0.0
#       file:
#         - /templates/version.yml
#         - /templates/gradle.yml
#
# Jobs:
#   .gradle-test   runs the unit tests
#   .gradle-build  packages the application and skips tests (they already ran)
#
# `.gradle-build` has no default `needs`, so it waits for the earlier `test`
# stage and still receives VERSION from `version:calculate` (which runs in
# `.pre`). If you add `needs` to the build job, list `version:calculate`
# explicitly there: dotenv variables are only inherited from direct needs.
# On MR pipelines / repos without semantic versioning, VERSION is empty and
# the snapshot fallback below is used.

.gradle-base:
  image: $GRADLE_IMAGE
  variables:
    GRADLE_IMAGE: "gradle:9-jdk25"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.console=plain"
  cache:
    key: "gradle-$CI_PROJECT_NAME"
    paths:
      - .gradle/caches
      - .gradle/wrapper
  interruptible: true

.gradle-test:
  extends: .gradle-base
  stage: test
  script:
    - chmod +x gradlew
    - ./gradlew test

.gradle-build:
  extends: .gradle-base
  stage: build
  script:
    - java -version
    - chmod +x gradlew
    # Tests already ran in .gradle-test; only package here.
    - ./gradlew build -x test -Pversion="${VERSION:-0.0.0-SNAPSHOT}"
  artifacts:
    paths:
      - build/libs/
    expire_in: 1 day
