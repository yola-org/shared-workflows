# Gradle test + build (JDK 25). Override GRADLE_IMAGE per project if needed.
include:
  - project: "tech1212145/ci-templates"
    ref: master
    file:
      - templates/version.yml

.gradle-base:
  image: $GRADLE_IMAGE
  variables:
    GRADLE_IMAGE: "gradle:9-jdk25"

.gradle-test:
  extends: .gradle-base
  stage: test
  script:
    - chmod +x gradlew
    - ./gradlew clean test

.gradle-build:
  extends: .gradle-base
  stage: build
  needs:
    # version:calculate only exists on the default branch, so it is optional here.
    # Other branches / MR pipelines build with the snapshot fallback below.
    - job: version:calculate        # rename here if your version job has another name
      artifacts: true
      optional: true
  script:
    - java -version
    - chmod +x gradlew
    - ./gradlew clean build -Pversion="${VERSION:-0.0.0-SNAPSHOT}"
  artifacts:
    paths:
      - build/libs/
      - docker/Dockerfile
    expire_in: 1 day