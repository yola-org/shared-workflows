# Opens an MR in the infra repo bumping an image tag in a tfvars file.
# Job variables to set: INFRA_COMPONENT, INFRA_TF_VAR_KEY
# Optional: INFRA_PROJECT_PATH, INFRA_TARGET_BRANCH, INFRA_TARGET_FILE, INFRA_ENV_LABEL

.update-infra-image-tag:
  stage: release
  image: alpine:latest
  variables:
    INFRA_PROJECT_PATH: "aws-infra"
    INFRA_TARGET_BRANCH: "dev"
    INFRA_TARGET_FILE: "envs/dev/terraform.tfvars"
    INFRA_ENV_LABEL: "dev"
  needs:
    - job: calculate-version
      artifacts: true
    - job: git-tag
  before_script:
    - apk add --no-cache git curl jq
  script:
    - |
      set -eu

      : "${INFRA_COMPONENT:?INFRA_COMPONENT is required}"
      : "${INFRA_TF_VAR_KEY:?INFRA_TF_VAR_KEY is required}"

      BRANCH_NAME="update-${INFRA_COMPONENT}-${INFRA_ENV_LABEL}-${VERSION}"
      INFRA_FULL_PATH="${CI_PROJECT_NAMESPACE}/${INFRA_PROJECT_PATH}"
      INFRA_REPO_URL="https://oauth2:${ACCESS_TOKEN}@${CI_SERVER_HOST}/${INFRA_FULL_PATH}.git"

      git clone "$INFRA_REPO_URL" infra-repo
      cd infra-repo

      git config user.name "GitLab CI Bot"
      git config user.email "ci-bot@example.com"
      git checkout -b "$BRANCH_NAME" "origin/${INFRA_TARGET_BRANCH}"

      [ -f "$INFRA_TARGET_FILE" ] || { echo "ERROR: ${INFRA_TARGET_FILE} not found"; exit 1; }

      sed -i -E "s/(${INFRA_TF_VAR_KEY}[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${VERSION}\2/" "$INFRA_TARGET_FILE"

      if git diff --quiet; then
        echo "ERROR: ${INFRA_TF_VAR_KEY} not found or already at ${VERSION} in ${INFRA_TARGET_FILE}"
        exit 1
      fi

      git add "$INFRA_TARGET_FILE"
      git commit -m "chore(${INFRA_ENV_LABEL}): update ${INFRA_COMPONENT} version to ${VERSION}"
      git push origin "$BRANCH_NAME"

      ENCODED_PATH=$(printf '%s' "$INFRA_FULL_PATH" | jq -sRr @uri)
      API_URL="${CI_API_V4_URL}/projects/${ENCODED_PATH}/merge_requests"

      PAYLOAD=$(jq -n \
        --arg source "$BRANCH_NAME" \
        --arg target "$INFRA_TARGET_BRANCH" \
        --arg title "chore(${INFRA_ENV_LABEL}): update ${INFRA_COMPONENT} to v${VERSION}" \
        --arg desc "Automated version bump for ${INFRA_COMPONENT} to v${VERSION}" \
        '{source_branch: $source, target_branch: $target, title: $title, description: $desc}')

      RESPONSE=$(curl --silent --request POST "$API_URL" \
        --header "PRIVATE-TOKEN: ${ACCESS_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "$PAYLOAD")

      MR_URL=$(echo "$RESPONSE" | jq -r '.web_url // empty')
      if [ -n "$MR_URL" ]; then
        echo "Created MR: $MR_URL"
      else
        echo "Failed to create MR:"; echo "$RESPONSE"; exit 1
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'