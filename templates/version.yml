
# ============================================================
# Shared CI Template: Semantic Versioning & Git Tag Creation
#
# Templates:
#   .version:calculate
#   .version:tag
#
# Required variables:
#   ACCESS_TOKEN       GitLab token with write_repository
#
# Optional variables:
#   VERSION_PREFIX     "" | "dev-" | "prod-"
#   VERSION_INITIAL   1.0.0
#   VERSION_BUMP      major | minor | patch
#
# Outputs (dotenv):
#   VERSION
#   GIT_TAG
#
# Versioning rules:
#   !feat:  major
#   feat:   minor
#   fix:    patch
#
# VERSION_BUMP overrides automatic commit detection.
#
# Independent version streams:
#   dev-1.0.0 -> dev-1.1.0
#   prod-1.0.0 -> prod-1.1.0
# ============================================================

variables:
  VERSION_PREFIX: ""
  VERSION_INITIAL: "1.0.0"

# ============================================================
# Calculate Semantic Version
# ============================================================

.version:calculate:
  stage: prepare
  image: alpine:3.21

  before_script:
    - apk add --no-cache git

  script:
    - |
      set -eu

      VERSION_PREFIX="${VERSION_PREFIX:-}"
      VERSION_INITIAL="${VERSION_INITIAL:-1.0.0}"

      echo "============================================"
      echo "Calculating semantic version"
      echo "Environment prefix: ${VERSION_PREFIX}"
      echo "============================================"

      # Validate initial version
      if ! printf '%s\n' "$VERSION_INITIAL" |
        awk '/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ { valid=1 }
             END { exit !valid }'; then
        echo "ERROR: Invalid VERSION_INITIAL: ${VERSION_INITIAL}"
        exit 1
      fi

      # Fetch all remote tags
      echo "Fetching Git tags..."
      git fetch --force --tags origin

      # Find latest tag belonging to this environment
      LATEST_TAG=$(
        git tag --list "${VERSION_PREFIX}[0-9]*" \
          --sort=-version:refname |
        awk -v prefix="$VERSION_PREFIX" '
          {
            version = $0

            if (prefix != "") {
              if (index(version, prefix) != 1)
                next

              version = substr(version, length(prefix) + 1)
            }

            if (version ~ /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/) {
              print $0
              exit
            }
          }
        '
      )

      echo "Latest matching tag: ${LATEST_TAG:-none}"

      # Determine version bump
      if [ -n "${VERSION_BUMP:-}" ]; then
        BUMP="$VERSION_BUMP"
      else
        case "${CI_COMMIT_TITLE:-}" in
          !feat:*)
            BUMP="major"
            ;;
          feat:*)
            BUMP="minor"
            ;;
          fix:*)
            BUMP="patch"
            ;;
          *)
            BUMP="patch"
            ;;
        esac
      fi

      case "$BUMP" in
        major|minor|patch)
          ;;
        *)
          echo "ERROR: Invalid VERSION_BUMP: ${BUMP}"
          exit 1
          ;;
      esac

      # First release starts at VERSION_INITIAL.
      # Subsequent releases increment the latest version.
      if [ -z "$LATEST_TAG" ]; then

        VERSION="$VERSION_INITIAL"
        echo "No previous tag found. Using initial version."

      else

        CURRENT_VERSION="${LATEST_TAG#"$VERSION_PREFIX"}"

        IFS='.' read -r MAJOR MINOR PATCH <<EOF
      $CURRENT_VERSION
      EOF

        echo "Current version: ${CURRENT_VERSION}"
        echo "Version bump: ${BUMP}"

        case "$BUMP" in
          major)
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            ;;
          minor)
            MINOR=$((MINOR + 1))
            PATCH=0
            ;;
          patch)
            PATCH=$((PATCH + 1))
            ;;
        esac

        VERSION="${MAJOR}.${MINOR}.${PATCH}"

      fi

      # Construct complete Git tag
      GIT_TAG="${VERSION_PREFIX}${VERSION}"

      # Validate generated tag
      if ! git check-ref-format "refs/tags/${GIT_TAG}"; then
        echo "ERROR: Invalid Git tag: ${GIT_TAG}"
        exit 1
      fi

      echo "============================================"
      echo "Commit: ${CI_COMMIT_TITLE:-unknown}"
      echo "Previous tag: ${LATEST_TAG:-none}"
      echo "Version bump: ${BUMP}"
      echo "New version: ${VERSION}"
      echo "Final Git tag: ${GIT_TAG}"
      echo "============================================"

      # Ensure generated tag does not already exist
      if git ls-remote --exit-code --tags origin \
        "refs/tags/${GIT_TAG}" >/dev/null 2>&1; then
        echo "ERROR: Tag ${GIT_TAG} already exists."
        exit 1
      fi

      # Export variables for downstream jobs
      {
        echo "VERSION=${VERSION}"
        echo "GIT_TAG=${GIT_TAG}"
      } > version.env

      echo "Version exported successfully."

  artifacts:
    reports:
      dotenv: version.env
    expire_in: 1 week


# ============================================================
# Create and Push Git Tag
# ============================================================

.version:tag:
  stage: release
  image: alpine:3.21

  before_script:
    - apk add --no-cache git

  script:
    - |
      set -eu

      : "${VERSION:?VERSION is required}"
      : "${GIT_TAG:?GIT_TAG is required}"
      : "${ACCESS_TOKEN:?ACCESS_TOKEN is required}"

      echo "============================================"
      echo "Creating Git tag"
      echo "Version: ${VERSION}"
      echo "Tag: ${GIT_TAG}"
      echo "============================================"

      # Validate tag format
      if ! git check-ref-format "refs/tags/${GIT_TAG}"; then
        echo "ERROR: Invalid Git tag: ${GIT_TAG}"
        exit 1
      fi

      # Git identity
      git config user.name "GitLab CI Bot"
      git config user.email "ci-bot@example.com"

      # Fetch remote tags
      git fetch --force --tags origin

      # Prevent duplicate tags
      if git ls-remote --exit-code --tags origin \
        "refs/tags/${GIT_TAG}" >/dev/null 2>&1; then
        echo "ERROR: Tag ${GIT_TAG} already exists."
        exit 1
      fi

      # Create annotated tag on current pipeline commit
      git tag -a "${GIT_TAG}" \
        -m "Release ${VERSION}"

      # Push tag without triggering another pipeline
      git push -o ci.skip \
        "https://oauth2:${ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        "refs/tags/${GIT_TAG}"

      echo "============================================"
      echo "Successfully created Git tag!"
      echo "Version: ${VERSION}"
      echo "Tag: ${GIT_TAG}"
      echo "============================================"
