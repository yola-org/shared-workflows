# Docker build + push to ECR (versioned tag + latest). Default branch only.
# Required: DOCKER_IMAGE_NAME (job var), DOCKER_REGISTRY + AWS_DEFAULT_REGION (CI/CD vars)

.docker-build-push-ecr:
  stage: release
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
      variables:
        DOCKER_TLS_CERTDIR: "/certs"
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKERFILE_PATH: "docker/Dockerfile"
    DOCKER_BUILD_CONTEXT: "."
  needs:
    - job: calculate-version
      artifacts: true
    - job: build
      artifacts: true
  resource_group: release-$CI_PROJECT_NAME
  before_script:
    - apk add --no-cache aws-cli
  script:
    - |
      set -eu

      : "${AWS_DEFAULT_REGION:?AWS_DEFAULT_REGION is required}"
      : "${DOCKER_REGISTRY:?DOCKER_REGISTRY is required}"
      : "${DOCKER_IMAGE_NAME:?DOCKER_IMAGE_NAME is required}"

      aws sts get-caller-identity

      IMAGE_URI="${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}"

      aws ecr get-login-password --region "$AWS_DEFAULT_REGION" |
        docker login --username AWS --password-stdin "$DOCKER_REGISTRY"

      docker build \
        --file "$DOCKERFILE_PATH" \
        --build-arg APP_VERSION="$VERSION" \
        --tag "${IMAGE_URI}:${VERSION}" \
        --tag "${IMAGE_URI}:latest" \
        "$DOCKER_BUILD_CONTEXT"

      docker push "${IMAGE_URI}:${VERSION}"
      docker push "${IMAGE_URI}:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'