# Docker build + push to ECR (versioned tag + latest). Default branch only.
#
# Depends on templates/version.yml: the VERSION used for the image tag comes
# from the `version:calculate` job. Include BOTH files in the consuming repo:
#
#   include:
#     - project: my-group/ci-templates
#       ref: v1.0.0
#       file:
#         - /templates/version.yml
#         - /templates/docker.yml
#
#   docker-build-push:
#     extends: .docker-build-push-ecr
#     variables:
#       DOCKER_IMAGE_NAME: my-service
#
# Required: DOCKER_IMAGE_NAME (job var), DOCKER_REGISTRY + AWS_DEFAULT_REGION (CI/CD vars)
# Optional: DOCKERFILE_PATH, DOCKER_BUILD_CONTEXT, VERSION_SKIP (see version.yml)
#
# `version:calculate` and `build` are optional needs so this template can be
# reused by repos that do not use semantic versioning or the Gradle template.
# The job itself still fails fast if VERSION is missing.

.docker-build-push-ecr:
  stage: release
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
      variables:
        DOCKER_TLS_CERTDIR: "/certs"
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKERFILE_PATH: "docker/Dockerfile"
    DOCKER_BUILD_CONTEXT: "."
  needs:
    - job: version:calculate
      artifacts: true
      optional: true
    - job: build
      artifacts: true
      optional: true
  resource_group: release-$CI_PROJECT_NAME
  before_script:
    - apk add --no-cache aws-cli
  script:
    - |
      set -eu

      : "${VERSION:?VERSION is required (from version:calculate)}"
      : "${AWS_DEFAULT_REGION:?AWS_DEFAULT_REGION is required}"
      : "${DOCKER_REGISTRY:?DOCKER_REGISTRY is required}"
      : "${DOCKER_IMAGE_NAME:?DOCKER_IMAGE_NAME is required}"

      aws sts get-caller-identity

      IMAGE_URI="${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}"

      aws ecr get-login-password --region "$AWS_DEFAULT_REGION" |
        docker login --username AWS --password-stdin "$DOCKER_REGISTRY"

      docker build \
        --file "$DOCKERFILE_PATH" \
        --build-arg APP_VERSION="$VERSION" \
        --tag "${IMAGE_URI}:${VERSION}" \
        --tag "${IMAGE_URI}:latest" \
        "$DOCKER_BUILD_CONTEXT"

      docker push "${IMAGE_URI}:${VERSION}"
      docker push "${IMAGE_URI}:latest"
  rules:
    - if: '$VERSION_SKIP == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
