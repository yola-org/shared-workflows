
# ============================================================
# Shared CI Template: Git Tag Creation
#
# Job:
#   git-tag:create
#
# Required:
#   VERSION
#   GIT_TAG
#   ACCESS_TOKEN
#
# ACCESS_TOKEN:
#   GitLab project/group access token with write_repository.
#
# Behavior:
#   - Creates an annotated Git tag.
#   - Pushes the tag to the current repository.
#   - Runs only on the default branch.
#   - Runs after previous pipeline stages succeed.
#
# Expected:
#   version:calculate must provide VERSION and GIT_TAG
#   through a dotenv artifact.
# ============================================================

include:
  - project: "tech1212145/ci-templates"
    ref: master                      # keep identical to the ref in the consumer pipeline
    file: templates/version.yml

.git-tag:
  stage: release
  image: alpine:3.21

  before_script:
    - apk add --no-cache git

  script:
    - |
      set -eu

      : "${VERSION:?VERSION is required}"
      : "${GIT_TAG:?GIT_TAG is required}"
      : "${ACCESS_TOKEN:?ACCESS_TOKEN is required}"

      echo "Preparing Git tag ${GIT_TAG}..."

      git config user.name "GitLab CI Bot"
      git config user.email "ci-bot@example.com"

      # Ensure the tag does not already exist
      git fetch --force --tags origin

      if git ls-remote --exit-code --tags origin \
        "refs/tags/${GIT_TAG}" >/dev/null 2>&1; then
        echo "ERROR: Tag ${GIT_TAG} already exists."
        exit 1
      fi

      # Create annotated tag
      git tag -a "$GIT_TAG" \
        -m "Release ${VERSION}"

      # Push tag to current repository
      git push \
        "https://oauth2:${ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        "$GIT_TAG"

      echo "============================================"
      echo "GIT TAG CREATED SUCCESSFULLY"
      echo "============================================"
      echo "Version: ${VERSION}"
      echo "Tag: ${GIT_TAG}"
      echo "============================================"

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
