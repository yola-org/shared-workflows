# ============================================================
# Shared CI Template: Git Tag Creation
#
# Job:
#   .git-tag
#
# Required:
#   VERSION, GIT_TAG   (from version:calculate via dotenv)
#   ACCESS_TOKEN       (project/group access token with write_repository)
#
# Optional (set in the extending job's `variables:`):
#   GIT_TAG_PREFIX  - prepended to the calculated tag     (prod- -> prod-v1.2.0)
#   GIT_TAG_SUFFIX  - appended to the calculated tag      (-rc   -> v1.2.0-rc)
#   GIT_TAG_NAME    - full override, ignores the two above
#                     can reference $VERSION               (release-$VERSION)
#
# Behavior:
#   - Creates an annotated Git tag and pushes it without starting a pipeline.
#   - Runs only on the default branch (override `rules` in the consumer).
# ============================================================

include:
  - project: "tech1212145/ci-templates"
    ref: master                      # keep identical to the ref in the consumer pipeline
    file: templates/version.yml

.git-tag:
  stage: release
  image: alpine:3.21

  variables:
    GIT_TAG_PREFIX: ""
    GIT_TAG_SUFFIX: ""
    GIT_TAG_NAME: ""

  before_script:
    - apk add --no-cache git

  script:
    - |
      set -eu

      : "${VERSION:?VERSION is required}"
      : "${GIT_TAG:?GIT_TAG is required}"
      : "${ACCESS_TOKEN:?ACCESS_TOKEN is required}"

      # Resolve the final tag name
      if [ -n "${GIT_TAG_NAME:-}" ]; then
        FINAL_TAG="$GIT_TAG_NAME"
      else
        FINAL_TAG="${GIT_TAG_PREFIX:-}${GIT_TAG}${GIT_TAG_SUFFIX:-}"
      fi

      if ! git check-ref-format "refs/tags/${FINAL_TAG}"; then
        echo "ERROR: '${FINAL_TAG}' is not a valid Git tag name."
        exit 1
      fi

      echo "Preparing Git tag ${FINAL_TAG}..."

      git config user.name "GitLab CI Bot"
      git config user.email "ci-bot@example.com"

      # Ensure the tag does not already exist
      git fetch --force --tags origin

      if git ls-remote --exit-code --tags origin \
        "refs/tags/${FINAL_TAG}" >/dev/null 2>&1; then
        echo "ERROR: Tag ${FINAL_TAG} already exists."
        exit 1
      fi

      # Create annotated tag
      git tag -a "$FINAL_TAG" -m "Release ${VERSION}"

      # Push tag without triggering a pipeline
      git push -o ci.skip \
        "https://oauth2:${ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        "$FINAL_TAG"

      echo "============================================"
      echo "GIT TAG CREATED SUCCESSFULLY"
      echo "Version: ${VERSION}"
      echo "Tag: ${FINAL_TAG}"
      echo "============================================"

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'