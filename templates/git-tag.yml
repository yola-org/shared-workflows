# ============================================================
# Shared CI Template: Git Tag Creation
#
# Expects VERSION and GIT_TAG from templates/version.yml.
# GIT_TAG is already final: 1.2.3 or 1.2.3-dev.
# ============================================================

include:
  - project: "tech1212145/ci-templates"
    ref: master
    file: templates/version.yml

.git-tag:
  stage: release
  image: alpine:3.21

  before_script:
    - apk add --no-cache git

  script:
    - |
      set -eu

      : "${VERSION:?VERSION is required}"
      : "${GIT_TAG:?GIT_TAG is required}"
      : "${ACCESS_TOKEN:?ACCESS_TOKEN is required}"

      FINAL_TAG="$GIT_TAG"

      if ! git check-ref-format "refs/tags/${FINAL_TAG}"; then
        echo "ERROR: '${FINAL_TAG}' is not a valid Git tag name."
        exit 1
      fi

      git config user.name "GitLab CI Bot"
      git config user.email "ci-bot@example.com"
      git fetch --force --tags origin

      if git ls-remote --exit-code --tags origin \
        "refs/tags/${FINAL_TAG}" >/dev/null 2>&1; then
        echo "Tag ${FINAL_TAG} already exists; skipping."
        exit 0
      fi

      git tag -a "$FINAL_TAG" -m "Release ${VERSION}"

      git push -o ci.skip \
        "https://oauth2:${ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        "$FINAL_TAG"

      echo "Created tag: ${FINAL_TAG}"

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'