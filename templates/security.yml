# GitLab built-in SAST + Secret Detection.
#
#   include:
#     - project: my-group/ci-templates
#       ref: v1.0.0
#       file: /templates/security.yml
#
# The consumer repo must have `test` and `secret-detection` in its `stages`
# list. If it does not define `stages` at all, the two stages below are used.
# A repo-level `stages` list takes precedence over the one in this file.

stages:
  - test
  - secret-detection

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# `needs: []` starts the scans immediately, in parallel with the rest of the
# pipeline. The SAST analyzer jobs inherit `needs` from `sast` via `extends`.
sast:
  stage: test
  needs: []

secret_detection:
  stage: secret-detection
  needs: []
